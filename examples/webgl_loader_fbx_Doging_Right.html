<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - Escenario 3D Inmersivo</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener" style="color: #ffff00; text-decoration: none;">three.js</a> - Escenario 3D Inmersivo<br />
			Modelo con textura, ambiente HDR y música de fondo
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import Stats from 'three/addons/libs/stats.module.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
			
			import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
			import { Audio, AudioListener, AudioLoader } from 'three';

			const manager = new THREE.LoadingManager();
			const textureLoader = new THREE.TextureLoader(); 

			let camera, scene, renderer, controls, stats, object, loader;
			let mixer;

			const clock = new THREE.Clock();

			const params = { asset: 'Dodging Right' };
			const assets = [ 'Dodging Right' ];

			init();

			function init() {
				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 100, 200, 300 );

				scene = new THREE.Scene();
				// Color de fondo por defecto (por si el HDR falla, verás gris y no negro)
				scene.background = new THREE.Color( 0x888888 ); 
				
				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 3 );
				hemiLight.position.set( 0, 200, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff, 3 );
				dirLight.position.set( 0, 200, 100 );
				dirLight.castShadow = true; 
				scene.add( dirLight );

				// =====================================================================
				// 🟩 PISO CON TEXTURA (Ajusta la ruta si es necesario)
				// =====================================================================
				// Asumo que tu cielo.jpg está en models/textures/. Si está en otro lado, cámbialo.
				const texturaPiso = textureLoader.load( 'models/textures/cielo.jpg' ); 
				texturaPiso.colorSpace = THREE.SRGBColorSpace;
				texturaPiso.wrapS = THREE.RepeatWrapping;
				texturaPiso.wrapT = THREE.RepeatWrapping;
				texturaPiso.repeat.set( 10, 10 ); 

				const mesh = new THREE.Mesh( 
					new THREE.PlaneGeometry( 2000, 2000 ), 
					new THREE.MeshStandardMaterial( { map: texturaPiso, roughness: 0.8, metalness: 0.2 } ) 
				);
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );
			
				loader = new FBXLoader( manager );
				loadAsset( params.asset );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 100, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				stats = new Stats();
				container.appendChild( stats.dom );

				// =====================================================================
				// 🌄 AMBIENTE 360° HDR 
				// =====================================================================
				// Si el profesor lo puso en models/rgbe/, la ruta es 'models/rgbe/cielo.hdr'
				console.log("Cargando HDR...");
				const rgbeLoader = new RGBELoader();
				rgbeLoader.load('models/rgbe/cielo.hdr', function (texture) {
					console.log("¡HDR cargado!");
					texture.mapping = THREE.EquirectangularReflectionMapping;
					scene.background = texture;
					scene.environment = texture; 
				}, undefined, function(error) {
					console.error("ERROR cargando HDR (models/rgbe/cielo.hdr):", error);
				});

				// =====================================================================
				// 🔊 MÚSICA MP3
				// =====================================================================
				// Si el profesor lo puso en models/rgbe/, la ruta es 'models/rgbe/cielo.mp3'
				const listener = new AudioListener();
				camera.add(listener);
				const sound = new Audio(listener);
				const audioLoader = new AudioLoader();
				
				audioLoader.load('models/rgbe/cielo.mp3', function (buffer) {
					console.log("¡Música cargada!");
					sound.setBuffer(buffer);
					sound.setLoop(true);
					sound.setVolume(0.5);
					document.addEventListener('click', function() {
						if ( sound.context.state === 'suspended' ) sound.context.resume();
						if ( ! sound.isPlaying ) sound.play();
					});
				}, undefined, function(error) {
					console.error("ERROR cargando MP3 (models/rgbe/cielo.mp3):", error);
				});
			}

			function loadAsset( asset ) {
				// Modelo FBX en models/fbx/
				loader.load( 'models/fbx/' + encodeURIComponent( asset ) + '.fbx', function ( group ) {
					if ( object ) {
						scene.remove( object );
					}

					object = group;

					if ( object.animations && object.animations.length ) {
						mixer = new THREE.AnimationMixer( object );
						const action = mixer.clipAction( object.animations[ 0 ] );
						action.play();
					}

					// Textura del modelo en models/textures/
					const wrapperTexture = textureLoader.load( 'models/textures/5.jpg' );
					wrapperTexture.colorSpace = THREE.SRGBColorSpace; 

					object.traverse( function ( child ) {
						if ( child.isMesh ) {
							child.castShadow = true;
							child.receiveShadow = true;

							child.material = new THREE.MeshStandardMaterial( {
								map: wrapperTexture,
								color: 0xffffff,    
								roughness: 0.3, 
								metalness: 0.4,      
								side: THREE.DoubleSide
							} );
						}
					} );

					scene.add( object );
					console.log("¡Modelo cargado!");

				}, undefined, function(error) {
					console.error("ERROR: No se encontró el FBX en models/fbx/Dodging Right.fbx", error);
				} );
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
			}

			function animate() {
				const delta = clock.getDelta();
				if ( mixer ) mixer.update( delta );
				controls.update();
				renderer.render( scene, camera );
				stats.update();
			}
		</script>
	</body>
</html>
